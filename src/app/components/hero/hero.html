<section class="space-y-6">

    <span class="relative flex h-2 w-2">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-500 dark:bg-emerald-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-600 dark:bg-emerald-500"></span>

    {{ ts.translate('hero.available') }}

  <div class="space-y-3">

      {{ ts.translate('hero.greeting') }} <span class="text-transparent bg-clip-text bg-gradient-to-r from-neutral-950 via-neutral-700 to-neutral-500 dark:from-neutral-100 dark:via-neutral-300 dark:to-neutral-500">Pablo Bentivengo</span>

    <p class="text-xl sm:text-2xl font-medium text-neutral-600 dark:text-neutral-400">

    {{ ts.translate('hero.bio') }}
